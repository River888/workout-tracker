  h += `<div class="info-card">${renderVolumeBalance()}</div>`;
  h += `<div class="sec-label" style="margin-top:22px">Schedule</div>`;
  [['3-Day Week','Tue: A · Wed: B · Fri: C'],['2-Day (even weeks)','A + C'],['2-Day (odd weeks)','B + C'],['Time-crunched','Express X1 + X2']].forEach(s=>{
    h += `<div class="info-card" style="padding:12px 14px"><h4 style="margin-bottom:3px">${s[0]}</h4><p>${s[1]}</p></div>`;
  });
  h += `<div class="sec-label" style="margin-top:22px">Evidence-Based Tips</div>`;
  TIPS.forEach(t=>{ h += `<div class="info-card"><div class="ic">${t.ic}</div><h4>${t.t}</h4><p>${t.b}</p></div>`; });

  h += `<div class="sec-label" style="margin-top:22px">Routine</div>
    <div class="info-card">
      <h4>${esc(r.name)}</h4>
      <p>${r.days.length} day${r.days.length===1?'':'s'} · ${exTotal} exercise${exTotal===1?'':'s'} · active</p>
      <button class="backup-btn" style="margin-top:14px;width:100%" onclick="goRoutines()">Manage routines</button>
    </div>`;

  const dbOn = getSetting('dbSnap', true);
  h += `<div class="sec-label" style="margin-top:22px">Settings</div>
    <div class="info-card">
      <div class="set-item">
        <div style="flex:1">
          <div class="si-t">Dumbbell stack snapping</div>
          <div class="si-d">Snap weights to your adjustable dumbbell increments. Off = standard 2.5&nbsp;kg steps. Either way, tap “Other…” in a picker to type any number.</div>
        </div>
        <button class="switch ${dbOn?'on':''}" role="switch" aria-checked="${dbOn}" onclick="toggleSetting('dbSnap', true)"></button>
      </div>
    </div>`;

  const sessCount = getHistory().length;
  h += `<div class="sec-label" style="margin-top:22px">Backup & Restore</div>
    <div class="info-card">
      <p style="margin-bottom:14px">Stored on this device only. Full backups include both routines and history. Import merges without creating duplicates.</p>
      <div style="display:flex;gap:10px">
        <button class="backup-btn" onclick="exportData()">⬇ Export all (${sessCount})</button>
        <button class="backup-btn" onclick="document.getElementById('importFile').click()">⬆ Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this)">
      <button class="danger-btn" style="width:100%;margin-top:10px" onclick="clearAllHistory()">Clear all history</button>
    </div>`;
  h += `</div>`;
  return h;
}
function renderVolumeBalance(){
  const { planned, actual } = computeVolume();
  const groups = [...new Set([...Object.keys(planned), ...Object.keys(actual)])];
  if(!groups.length) return `<p class="prog-sub" style="font-size:13px">Add exercises to your routine to see its volume balance.</p>`;
  const max = Math.max(1, ...groups.map(g=>Math.max(planned[g]||0, actual[g]||0)));
  groups.sort((a,b)=> (planned[b]||0)-(planned[a]||0) || (actual[b]||0)-(actual[a]||0) || a.localeCompare(b));
  let h = `<div class="vol-legend"><span><i class="vdot plan"></i>Planned · ${esc(activeRoutine().name)}</span><span><i class="vdot act"></i>Logged · last 7 days</span></div>`;
  groups.forEach(g=>{
    const p = planned[g]||0, a = actual[g]||0, col = muscleColor(g);
    h += `<div class="vol-row">
      <div class="vol-head"><span class="vol-name">${esc(g)}</span><span class="vol-note">${p} planned · <b style="color:${a?col:'var(--dim)'}">${a} done</b></span></div>
      <div class="vol-track"><div class="vol-fill" style="width:${Math.round(p/max*100)}%;background:${col}"></div></div>
      <div class="vol-track act"><div class="vol-fill" style="width:${Math.round(a/max*100)}%;background:${col}"></div></div>
    </div>`;
  });
  h += `<p class="vol-foot">Muscle is inferred from each exercise's name, so it's approximate.</p>`;
  return h;
}

// ----------------- ROUTINE MANAGER -----------------
function renderRoutinesList(){
  const rs = getRoutines(); const activeId = getActiveId();
  let h = `<div class="sess-head"><button class="back" onclick="goProgInfo()">‹ Programme</button><h2>Routines</h2><div class="muscles">Switch, edit or build a routine</div></div><div class="pad">`;
  rs.forEach(r=>{
    const exTotal = r.days.reduce((a,d)=>a+d.exercises.length,0);
    const expCount = r.days.filter(d=>d.express).length;
    const isActive = r.id===activeId;
    h += `<div class="rt-card ${isActive?'active':''}">
      <div class="rt-name">${esc(r.name)} ${isActive?'<span class="rt-badge">ACTIVE</span>':''}</div>
      <div class="rt-meta">${r.days.length} day${r.days.length===1?'':'s'}${expCount?' ('+expCount+' express)':''} · ${exTotal} exercise${exTotal===1?'':'s'} · ${r.days.map(d=>d.code).join(' ')}</div>
      <div class="rt-actions">
        ${isActive?'':`<button class="rt-btn primary" onclick="activateRoutine('${r.id}')">Use this</button>`}
        <button class="rt-btn" onclick="editRoutine('${r.id}')">Edit</button>
        <button class="rt-btn" onclick="duplicateRoutine('${r.id}')">Duplicate</button>
        ${rs.length>1?`<button class="rt-btn warn" onclick="deleteRoutine('${r.id}')">Delete</button>`:''}
      </div>
    </div>`;
  });
  h += `<button class="add-block" onclick="newRoutine()">+ New routine</button>`;
  h += `<div style="display:flex;gap:10px;margin-bottom:12px">
      <button class="backup-btn" onclick="exportRoutines()">⬇ Export routines</button>
      <button class="backup-btn" onclick="document.getElementById('importRoutineFile').click()">⬆ Import routines</button>
    </div>
    <input type="file" id="importRoutineFile" accept="application/json,.json" style="display:none" onchange="importRoutines(this)">`;
  h += `<p style="font-size:12px;color:var(--dim);line-height:1.6;margin-top:4px">Importing adds routines without touching history or your existing routines. Grab <b>routine-template.json</b> from the repo to build one by hand. Exercises that share a name across routines keep one continuous progress chart and PR.</p>`;
  h += `</div>`;
  return h;
}

function renderRoutineEditor(){
  const r = routineById(state.editId);
  if(!r){ return renderRoutinesList(); }
  let h = `<div class="sess-head"><button class="back" onclick="backFromEdit()">‹ Routines</button><h2>Edit Routine</h2></div><div class="pad">`;
  h += `<div class="ed-field"><label>Routine name</label>
    <input class="ed-input" id="rt_name_${r.id}" value="${esc(r.name)}" onchange="renameRoutine('${r.id}')"></div>`;

  r.days.forEach(d=>{
    const open = state.editDayOpen===d.code;
    h += `<div class="day-edit">
      <div class="day-edit-head">
        <div class="day-code" style="background:${d.color}">${esc(d.code)}</div>
        <div style="flex:1" onclick="toggleEditDay('${d.code}')">
          <div style="font-weight:700;font-size:15px">${esc(d.focus||'Untitled day')}${d.express?'<span class="express-tag">EXPRESS</span>':''}</div>
          <div style="font-size:12px;color:var(--muted)">${d.exercises.length} exercise${d.exercises.length===1?'':'s'}</div>
        </div>
        <span class="chev" style="transform:rotate(${open?'90':'0'}deg)" onclick="toggleEditDay('${d.code}')">›</span>
      </div>`;
    if(open){
      h += `<div class="day-edit-body">
        <div class="ed-row">
          <div class="ed-field"><label>Focus / name</label><input class="ed-input" id="day_focus_${d.code}" value="${esc(d.focus)}" onchange="editDayField('${r.id}','${d.code}','focus')"></div>
          <div class="ed-field" style="flex:0 0 110px"><label>Duration</label><input class="ed-input" id="day_duration_${d.code}" value="${esc(d.duration)}" placeholder="~45 min" onchange="editDayField('${r.id}','${d.code}','duration')"></div>
        </div>
        <div class="ed-field"><label>Muscles (subtitle)</label><input class="ed-input" id="day_muscles_${d.code}" value="${esc(d.muscles)}" placeholder="Chest · Triceps…" onchange="editDayField('${r.id}','${d.code}','muscles')"></div>
        <div class="ed-field"><label>Type</label><div style="display:flex;gap:8px">
          <button class="seg-btn ${!d.express?'on':''}" onclick="setDayExpress('${r.id}','${d.code}',false)">Main day</button>
          <button class="seg-btn ${d.express?'on':''}" onclick="setDayExpress('${r.id}','${d.code}',true)">Express</button>
        </div></div>
        <div class="ed-field"><label>Colour</label><div class="swatch-row">`;
      DAY_PALETTE.forEach(c=>{ h += `<button class="swatch ${d.color===c?'sel':''}" style="background:${c}" onclick="setDayColor('${r.id}','${d.code}','${c}')"></button>`; });
      h += `</div></div>`;

      d.exercises.forEach((ex,idx)=>{
        if(state.exForm && state.exForm.code===d.code && state.exForm.idx===idx){
          h += renderExForm(r, d, ex, idx);
        } else {
          h += `<div class="ex-edit-row">
            <div class="eei" onclick="openExForm('${d.code}',${idx})">
              <div class="een">${esc(ex.name)}${ex.superset?'<span class="ss-tag" style="--accent:'+d.color+'">SS</span>':''}</div>
              <div class="ees">${ex.sets} × ${esc(ex.reps)} · ${restTxt(ex.rest)} rest${ex.superset?' · w/ '+esc(ex.superset):''}</div>
            </div>
            <button class="icon-btn" onclick="moveExercise('${r.id}','${d.code}',${idx},-1)">↑</button>
            <button class="icon-btn" onclick="moveExercise('${r.id}','${d.code}',${idx},1)">↓</button>
            <button class="icon-btn" onclick="deleteExercise('${r.id}','${d.code}',${idx})" style="color:#c66">✕</button>
          </div>`;
        }
      });
      if(state.exForm && state.exForm.code===d.code && (state.exForm.idx===null || state.exForm.idx===undefined)){
        h += renderExForm(r, d, null, null);
      } else {
        h += `<button class="det-add" style="margin-top:10px" onclick="openExForm('${d.code}',null)">+ Add exercise</button>`;
      }
      h += `<div class="det-actions"><button class="danger-btn" onclick="deleteDay('${r.id}','${d.code}')">Remove ${d.code}</button></div>`;
      h += `</div>`;
    }
    h += `</div>`;
  });

  h += `<div style="display:flex;gap:10px;margin-bottom:12px">
    <button class="add-block" style="margin:0" onclick="addDay('${r.id}',false)">+ Add day</button>
    <button class="add-block" style="margin:0" onclick="addDay('${r.id}',true)">+ Add express</button>
  </div>`;
  h += `</div>`;
  return h;
}

const TRACK_OPTS = [['weight','Weight + reps'],['reps','Reps only'],['time','Timed'],['interval','Interval (boxing)']];
function renderExForm(r, d, ex, idx){
  // draft (in-progress edits) survives a re-render triggered by changing type
  const src = (state.exForm && state.exForm.draft) ? state.exForm.draft : (ex || {});
  const track = src.track || trackOf(ex||{});
  const partnerOpts = d.exercises
    .map((e,i)=>({e,i}))
    .filter(o=> o.i!==idx)
    .map(o=>`<option value="${esc(o.e.name)}" ${src.superset===o.e.name?'selected':''}>${esc(o.e.name)}</option>`).join('');
  const muscleOpts = MUSCLE_GROUPS
    .map(m=>`<option value="${esc(m)}" ${src.muscle===m?'selected':''}>${esc(m)}</option>`).join('');
  const trackOpts = TRACK_OPTS.map(([v,l])=>`<option value="${v}" ${track===v?'selected':''}>${l}</option>`).join('');

  let typeFields = '';
  if(track==='interval'){
    typeFields = `<div class="ed-row">
      <div class="ed-field"><label>Rounds</label><input class="ed-input" id="ef_rounds" type="number" inputmode="numeric" value="${src.rounds!=null?src.rounds:(ex&&ex.rounds||3)}"></div>
      <div class="ed-field"><label>Work (sec)</label><input class="ed-input" id="ef_work" type="number" inputmode="numeric" value="${src.workSec!=null?src.workSec:(ex&&ex.workSec||180)}"></div>
      <div class="ed-field"><label>Rest (sec)</label><input class="ed-input" id="ef_restsec" type="number" inputmode="numeric" value="${src.restSec!=null?src.restSec:(ex&&ex.restSec||60)}"></div>
    </div>`;
  } else if(track==='time'){
    typeFields = `<div class="ed-row">
      <div class="ed-field"><label>Sets</label><input class="ed-input" id="ef_sets" type="number" inputmode="numeric" value="${src.sets!=null?src.sets:(ex&&ex.sets||3)}"></div>
      <div class="ed-field"><label>Duration (sec)</label><input class="ed-input" id="ef_work" type="number" inputmode="numeric" value="${src.workSec!=null?src.workSec:(ex&&ex.workSec||60)}"></div>
      <div class="ed-field" style="flex:0 0 90px"><label>Rest (s)</label><input class="ed-input" id="ef_rest" type="number" inputmode="numeric" value="${src.rest!=null?src.rest:(ex&&ex.rest!=null?ex.rest:45)}"></div>
    </div>`;
  } else {
    typeFields = `<div class="ed-row">
      <div class="ed-field"><label>Sets</label><input class="ed-input" id="ef_sets" type="number" inputmode="numeric" value="${src.sets!=null?src.sets:(ex&&ex.sets||3)}"></div>
      <div class="ed-field"><label>Reps</label><input class="ed-input" id="ef_reps" value="${esc(src.reps!=null?src.reps:(ex&&ex.reps||'10'))}" placeholder="8–10"></div>
      <div class="ed-field" style="flex:0 0 90px"><label>Rest (s)</label><input class="ed-input" id="ef_rest" type="number" inputmode="numeric" value="${src.rest!=null?src.rest:(ex&&ex.rest!=null?ex.rest:60)}"></div>
    </div>`;
  }
  const showEquip = (track==='weight'||track==='reps');
  return `<div style="background:var(--card2);border:1px solid var(--accent,#444);border-radius:11px;padding:14px;margin:8px 0;--accent:${d.color}">
    <div class="ed-field"><label>Exercise name</label>
      <input class="ed-input" id="ef_name" list="exNames" value="${esc(src.name||'')}" placeholder="e.g. Barbell Squat" autocomplete="off"></div>
    <div class="ed-field"><label>Tracking type</label>
      <select class="ed-input" id="ef_track" onchange="exFormChangeTrack()">${trackOpts}</select></div>
    ${typeFields}
    <div class="ed-row">
      ${showEquip?`<div class="ed-field"><label>Equipment (optional)</label><input class="ed-input" id="ef_equip" value="${esc(src.equipment||'')}" placeholder="Dumbbells, Cable…"></div>`:''}
      <div class="ed-field"><label>Primary muscle</label>
        <select class="ed-input" id="ef_muscle"><option value="">Auto (from name)</option>${muscleOpts}</select></div>
    </div>
    ${showEquip?`<div class="ed-field"><label>Superset with (optional)</label>
      <select class="ed-input" id="ef_ss"><option value="">— none —</option>${partnerOpts}</select></div>`:''}
    <div class="ed-field"><label>Cues (optional)</label><textarea class="ed-input" id="ef_cues">${esc(src.cues||'')}</textarea></div>
    <div class="ed-field"><label>Why (optional)</label><textarea class="ed-input" id="ef_why">${esc(src.why||'')}</textarea></div>
    <div class="form-actions">
      <button class="ghost-btn" onclick="closeExForm()">Cancel</button>
      <button class="rt-btn primary" style="flex:1" onclick="saveExForm('${r.id}','${d.code}')">Save exercise</button>
    </div>
  </div>`;
}

function renderNav(){
  const tabs = [['today','🏋️','Today'],['history','📈','History'],['program','📋','Programme']];
  let h = `<div class="nav">`;
  tabs.forEach(t=>{
    h += `<button class="${state.tab===t[0]?'active':''}" onclick="setTab('${t[0]}')">
      <span class="ico">${t[1]}</span>${t[2]}</button>`;
  });
  h += `</div>`;
  return h;
}

migrate();
migrateRename();

render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
