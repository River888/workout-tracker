<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Workout Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0b0d; --bg2: #0f1115; --card: #15171c; --card2: #1b1e25; --elev: #20242c;
    --border: #262a33; --border2: #323742;
    --text: #f4f5f7; --muted: #98a1b0; --dim: #5a6473;
    --push: #FF6B2C; --pull: #2B8AF0; --cond: #2FD27A; --pr: #FFC93C;
    --danger: #FF6B6B;
    --r: 18px; --r-sm: 12px; --r-xs: 9px;
    --sh-1: 0 1px 2px rgba(0,0,0,0.4);
    --sh-2: 0 8px 30px rgba(0,0,0,0.45);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --nav-h: calc(66px + var(--safe-b));
  }
  html, body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
  body {
    max-width: 520px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + 16px);
    min-height: 100vh; min-height: 100dvh; -webkit-text-size-adjust: 100%;
    background:
      radial-gradient(120% 60% at 50% -10%, #14161c 0%, var(--bg) 55%) fixed;
    letter-spacing: -0.01em;
  }
  button { font-family: inherit; cursor: pointer; border: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 16px; }
  select { cursor: pointer; }
  .hidden { display: none !important; }

  /* Header */
  .header { padding: max(26px, calc(var(--safe-t) + 16px)) 20px 16px; }
  .header .eyebrow { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; margin-bottom: 7px; font-weight: 600; }
  .header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .header .sub { margin-top: 6px; font-size: 14px; color: var(--muted); }

  /* Day cards */
  .pad { padding: 8px 16px 16px; }
  .day-grid { display: flex; gap: 11px; flex-wrap: wrap; }
  .day-btn {
    flex: 1 1 28%; min-width: 96px; padding: 20px 10px 16px; border-radius: var(--r);
    color: #fff; font-weight: 700; text-align: left; transition: transform 0.12s ease, box-shadow 0.12s;
    position: relative; overflow: hidden; isolation: isolate;
    box-shadow: var(--sh-1), inset 0 1px 0 rgba(255,255,255,0.16);
  }
  .day-btn::before { content: ''; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(155deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 42%, rgba(0,0,0,0.28)); }
  .day-btn:active { transform: scale(0.965); }
  .day-btn .big { font-size: 19px; letter-spacing: -0.02em; }
  .day-btn .small { font-size: 12px; opacity: 0.95; font-weight: 600; margin-top: 2px; }
  .day-btn .meta { font-size: 10.5px; opacity: 0.82; margin-top: 9px; font-weight: 500; }
  .routine-name { font-size: 13px; color: var(--muted); margin: 4px 0 16px; display: flex; align-items: center; gap: 7px; font-weight: 500; }
  .express-note { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin-bottom: 12px; }

  /* Section labels */
  .label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.13em; font-weight: 600; }
  .sec-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.13em; font-weight: 700; margin-bottom: 12px; }

  /* Exercise list (session) */
  .sess-head { padding: max(14px, calc(var(--safe-t) + 6px)) 18px 12px; position: sticky; top: 0; z-index: 20; background: linear-gradient(var(--bg) 72%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .sess-head .back { color: var(--muted); font-size: 14px; font-weight: 600; background: var(--card); border: 1px solid var(--border); padding: 8px 14px 8px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px; }
  .sess-head .back:active { background: var(--elev); }
  .sess-head h2 { font-size: 25px; font-weight: 800; margin-top: 12px; letter-spacing: -0.03em; }
  .sess-head .muscles { font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 5px; line-height: 1.5; font-weight: 600; }
  .sess-prog { height: 6px; background: var(--card2); border-radius: 999px; margin-top: 12px; overflow: hidden; }
  .sess-prog > div { height: 100%; border-radius: 999px; transition: width 0.4s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent); }

  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); margin: 10px 16px; overflow: hidden; transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s; }
  .ex-card.done { opacity: 0.5; }
  .ex-card.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: var(--sh-2), 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
  .ex-card.ss-card.open { border-color: color-mix(in srgb, var(--accent) 70%, var(--border)); }
  .ex-top { display: flex; align-items: center; padding: 16px; gap: 13px; }
  .ex-num { width: 34px; height: 34px; border-radius: 11px; background: var(--elev); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: var(--dim); flex-shrink: 0; transition: background 0.2s, color 0.2s; }
  .ex-num.active { color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
  .ex-num.complete { background: var(--cond); color: #06210f; }
  .ex-name { font-weight: 650; font-size: 16px; line-height: 1.25; letter-spacing: -0.015em; }
  .ex-equip { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .ex-target { font-weight: 800; font-size: 15px; text-align: right; flex-shrink: 0; letter-spacing: -0.02em; }
  .ex-rest { font-size: 11px; color: var(--dim); margin-top: 3px; text-align: right; white-space: nowrap; }
  .ss-tag { margin-left: 6px; font-size: 9px; background: color-mix(in srgb, var(--accent) 30%, var(--elev)); color: #fff; padding: 3px 6px; border-radius: 5px; vertical-align: middle; letter-spacing: 0.06em; font-weight: 700; }
  .ss-plus { color: var(--dim); margin: 0 2px; font-weight: 700; }
  .chev { color: var(--dim); font-size: 13px; transition: transform 0.25s cubic-bezier(.4,0,.2,1); flex-shrink: 0; }
  .express-tag { font-size: 9.5px; font-weight: 800; background: color-mix(in srgb, #9C7BFF 22%, var(--elev)); color: #c7b6ff; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.06em; margin-left: 8px; vertical-align: middle; }

  .ex-body { border-top: 1px solid var(--border); padding: 16px; }
  .cues { font-size: 13.5px; color: #cdd2da; line-height: 1.65; }
  .why { margin-top: 12px; padding: 12px 14px; background: var(--bg2); border-radius: var(--r-sm); }
  .why-text { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
  .meta-toggle { background: none; color: var(--muted); font-size: 12.5px; padding: 10px 0 0; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
  .db-note { font-size: 11.5px; color: color-mix(in srgb, var(--accent) 80%, var(--muted)); background: color-mix(in srgb, var(--accent) 10%, var(--bg2)); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: var(--r-xs); padding: 7px 10px; margin-bottom: 12px; line-height: 1.45; display: flex; gap: 6px; align-items: center; }
  .snap-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .snap-label { font-size: 11.5px; color: var(--muted); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snap-seg { display: flex; background: var(--card2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; flex-shrink: 0; }
  .snap-seg button { font-size: 11.5px; font-weight: 700; color: var(--muted); background: none; padding: 7px 13px; border-radius: 6px; }
  .snap-seg button.on { background: var(--accent); color: #fff; }

  /* Set logger */
  .sets-wrap { margin-top: 6px; }
  .sets-headrow { display: flex; align-items: center; gap: 6px; padding: 0 2px 8px; }
  .sets-headrow .h-idx { width: 16px; flex-shrink: 0; }
  .sets-headrow .h-col { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; font-weight: 700; }
  .sets-headrow .h-col.w { flex: 1.5; }
  .sets-headrow .h-col.r { flex: 1; }
  .sets-headrow .h-act { width: 46px; flex-shrink: 0; }
  .set-row { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; }
  .set-row.logged-row .field { border-color: color-mix(in srgb, var(--cond) 45%, var(--border)); background: color-mix(in srgb, var(--cond) 10%, var(--card2)); }
  .set-row.awaiting .field { border-color: var(--accent); animation: pulseB 1.3s ease-in-out infinite; }
  @keyframes pulseB { 0%,100%{ box-shadow: 0 0 0 0 transparent; } 50%{ box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent); } }
  .set-idx { width: 16px; font-size: 13px; color: var(--dim); font-weight: 800; flex-shrink: 0; text-align: center; }
  .field { display: flex; align-items: center; background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; min-height: 56px; transition: border-color 0.15s; }
  .field.w { flex: 1.5; }
  .field.r { flex: 1; }
  .field:focus-within { border-color: var(--accent); }
  .field .stepper { width: 34px; align-self: stretch; background: color-mix(in srgb, var(--bg) 55%, var(--card2)); color: var(--muted); font-size: 23px; font-weight: 400; line-height: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .field .stepper:active { background: var(--accent); color: #fff; }
  .pwrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; align-self: stretch; }
  .picker {
    appearance: none; -webkit-appearance: none; background: none; border: none;
    color: #fff; font-size: 19px; font-weight: 800; text-align: center; text-align-last: center;
    width: 100%; height: 100%; padding: 0 12px 0 4px; min-width: 0;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .picker:focus { outline: none; }
  .picker:disabled { color: #fff; opacity: 1; }
  .pwrap .caret { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 9px; pointer-events: none; }
  .set-row.logged-row .pwrap .caret { display: none; }
  .set-log-btn { background: var(--accent); color: #fff; border-radius: var(--r-sm); padding: 0 6px; min-height: 56px; width: 46px; flex-shrink: 0; font-weight: 800; font-size: 14px; transition: transform 0.12s, background 0.15s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
  .set-log-btn:active { transform: scale(0.92); }
  .set-log-btn.logged { background: color-mix(in srgb, var(--cond) 18%, var(--card2)); color: var(--cond); font-size: 20px; box-shadow: none; }
  .add-set { background: var(--card2); border: 1px dashed var(--border2); color: var(--muted); font-size: 13px; padding: 13px; border-radius: var(--r-sm); width: 100%; margin-top: 4px; font-weight: 600; }
  .add-set:active { background: var(--elev); }
  .last-time { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .last-time .pill { background: var(--bg2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; }
  .last-time b { color: var(--text); font-weight: 700; }
  .finish-banner { margin-top: 12px; padding: 12px; background: color-mix(in srgb, var(--cond) 12%, var(--bg2)); border: 1px solid color-mix(in srgb, var(--cond) 32%, transparent); border-radius: var(--r-sm); font-size: 12.5px; color: var(--cond); font-weight: 700; text-align: center; }
  .empty-ex { font-size: 13.5px; color: var(--dim); text-align: center; padding: 32px 16px; line-height: 1.6; }

  /* Superset block */
  .ss-info { display: flex; flex-direction: column; gap: 7px; margin-bottom: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .ss-mini { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; align-items: baseline; }
  .ss-mini-n { color: var(--text); font-weight: 650; flex-shrink: 0; }
  .ss-mini-v { color: var(--muted); text-align: right; }
  .ss-round { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; margin: 18px 0 10px; display: flex; align-items: center; gap: 10px; }
  .ss-round::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .ss-ex-label { font-size: 13px; font-weight: 700; margin: 8px 0 6px 2px; letter-spacing: -0.01em; }
  .ss-ex-label span { color: var(--dim); font-weight: 500; }

  /* Timer */
  .timer-overlay { position: fixed; inset: 0; background: rgba(6,7,9,0.96); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; max-width: 520px; margin: 0 auto; padding: 0 24px; }
  .timer-ring { position: relative; width: 256px; height: 256px; }
  .timer-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer-num .t { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .timer-num .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.2em; margin-top: 2px; font-weight: 700; }
  .timer-num .nextup { font-size: 12.5px; color: var(--dim); margin-top: 12px; max-width: 200px; text-align: center; line-height: 1.45; }
  .timer-num .timer-step { font-size: 12px; color: var(--dim); margin-top: 10px; font-weight: 700; letter-spacing: 0.1em; }
  .timer-phase { font-size: 15px; font-weight: 800; letter-spacing: 0.3em; margin-bottom: 26px; }
  .timer-controls { display: flex; gap: 12px; margin-top: 40px; }
  .timer-btn { background: var(--card); color: #fff; border: 1px solid var(--border2); border-radius: 14px; padding: 17px 28px; font-weight: 700; font-size: 15px; }
  .timer-btn:active { background: var(--elev); }
  .timer-btn.primary { background: var(--accent); border-color: var(--accent); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 40%, transparent); }
  .timer-stop { margin-top: 18px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }
  /* timed / interval start button */
  .time-btn { width: 100%; min-height: 56px; border-radius: var(--r-sm); background: var(--accent); color: #fff; font-weight: 800; font-size: 16px; box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform 0.12s; margin-top: 2px; }
  .time-btn:active { transform: scale(0.98); }
  .time-btn.done { background: color-mix(in srgb, var(--cond) 18%, var(--card2)); color: var(--cond); box-shadow: none; }
  .time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .time-row .time-btn { margin-top: 0; }

  /* Bottom nav */
  .nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 520px; margin: 0 auto; display: flex; background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding-bottom: var(--safe-b); z-index: 30; }
  .nav button { flex: 1; padding: 10px 0 11px; background: none; color: var(--dim); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.15s; position: relative; }
  .nav button.active { color: var(--text); }
  .nav button.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 28px; height: 3px; border-radius: 999px; background: var(--push); }
  .nav .ico { font-size: 21px; line-height: 1; }

  /* Segmented control */
  .seg { display: flex; background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px; margin-bottom: 16px; }
  .seg button { flex: 1; padding: 11px; font-size: 13px; font-weight: 700; color: var(--muted); background: none; border-radius: 9px; transition: all 0.15s; }
  .seg button.active { background: var(--elev); color: #fff; box-shadow: var(--sh-1); }

  /* History - workout cards */
  .wk-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 15px 16px; margin-bottom: 11px; transition: transform 0.1s, border-color 0.15s; }
  .wk-card:active { transform: scale(0.985); border-color: var(--border2); }
  .wk-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .wk-day { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
  .wk-date { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .wk-stats { text-align: right; font-size: 12px; color: var(--muted); flex-shrink: 0; line-height: 1.5; }
  .wk-stats b { color: var(--text); font-size: 16px; font-weight: 800; }
  .wk-exlist { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .wk-chip { font-size: 11px; background: var(--bg2); border: 1px solid var(--border); color: var(--muted); padding: 4px 9px; border-radius: 7px; }
  .wk-routine { font-size: 10px; color: var(--dim); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }

  /* Session detail */
  .det-ex { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 15px 16px; margin-bottom: 11px; }
  .det-ex h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .det-set { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .det-set .di { width: 22px; font-size: 12px; color: var(--dim); font-weight: 800; }
  .det-set .dinput { flex: 1; background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-xs); padding: 12px; color: #fff; font-size: 16px; text-align: center; min-width: 0; font-variant-numeric: tabular-nums; }
  .det-set .dinput:focus { outline: none; border-color: var(--accent); }
  .det-set .dunit { font-size: 11px; color: var(--dim); width: 22px; }
  .det-set .ddel { background: none; color: var(--danger); font-size: 20px; width: 36px; flex-shrink: 0; }
  .det-add { background: var(--card2); border: 1px dashed var(--border2); color: var(--muted); font-size: 12.5px; padding: 11px; border-radius: var(--r-xs); width: 100%; margin-top: 6px; font-weight: 600; }
  .det-actions { display: flex; gap: 10px; margin-top: 8px; }
  .danger-btn { flex: 1; background: color-mix(in srgb, var(--danger) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); color: var(--danger); border-radius: var(--r-sm); padding: 14px; font-size: 13px; font-weight: 700; }
  .ghost-btn { flex: 1; background: var(--card); border: 1px solid var(--border2); color: var(--text); border-radius: var(--r-sm); padding: 14px; font-size: 13px; font-weight: 700; }

  /* Progress charts */
  .prog-ex { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; padding: 17px; }
  .prog-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 12px; }
  .prog-head h3 { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
  .prog-sub { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .prog-pr { text-align: right; flex-shrink: 0; }
  .prog-pr .v { font-size: 19px; font-weight: 800; color: var(--pr); letter-spacing: -0.02em; }
  .prog-pr .l { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
  .trend { font-size: 12px; font-weight: 800; }
  .trend.up { color: var(--cond); } .trend.down { color: var(--danger); } .trend.flat { color: var(--dim); }
  .spark { display: flex; align-items: flex-end; gap: 5px; height: 88px; margin-top: 24px; padding-top: 4px; }
  .spark-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; min-width: 0; }
  .spark-bar { width: 100%; max-width: 28px; background: var(--accent); border-radius: 5px 5px 2px 2px; min-height: 4px; position: relative; transition: height 0.4s cubic-bezier(.4,0,.2,1); }
  .spark-bar.best { background: var(--pr); }
  .spark-bar .v { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); font-weight: 700; }
  .spark-date { font-size: 9px; color: var(--dim); margin-top: 7px; white-space: nowrap; }
  .empty { text-align: center; color: var(--dim); font-size: 13.5px; padding: 56px 20px; line-height: 1.7; }
  .empty .big { font-size: 38px; display: block; margin-bottom: 14px; }

// ================================================================
//  STORAGE  (localStorage when available, in-memory fallback)
// ================================================================
let memStore = {};
let storageOK = true;
try { const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); } catch(e){ storageOK=false; }
const DB = {
  get(key, def){
    if(storageOK){ try { const v = localStorage.getItem(key); return v===null ? def : JSON.parse(v); } catch(e){ return def; } }
    return (key in memStore) ? memStore[key] : def;
  },
  set(key, val){
    if(storageOK){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
    else { memStore[key] = val; }
  }
};
function uid(){ return 'r' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

// ---- settings ----
function getSetting(k, def){ return DB.get('set_'+k, def); }
function setSetting(k, v){ DB.set('set_'+k, v); }
function toggleSetting(k, def){ setSetting(k, !getSetting(k, def)); render(); }

// ---- routines ----
function getRoutines(){ return DB.get('routines', []); }
function saveRoutines(rs){ DB.set('routines', rs); }
function getActiveId(){ return DB.get('activeRoutine', null); }
function setActiveId(id){ DB.set('activeRoutine', id); }
function ensureSeed(){
  let rs = getRoutines();
  if(!rs || !rs.length){ rs = [deepCopy(SEED_ROUTINE)]; saveRoutines(rs); setActiveId(SEED_ROUTINE.id); }
  if(!getActiveId() || !rs.some(r=>r.id===getActiveId())) setActiveId(rs[0].id);
}
// one-time: add the Express days to an existing seed routine created before
// the express feature existed (guarded so it won't re-add if you delete them)
function migrate(){
  if(DB.get('migratedExpress', false)) return;
  const rs = getRoutines();
  const seed = rs.find(r=>r.id==='seed-ppc');
  if(seed){
    SEED_ROUTINE.days.filter(d=>d.express).forEach(ed=>{
      if(!seed.days.some(d=>d.code===ed.code)) seed.days.push(deepCopy(ed));
    });
    saveRoutines(rs);
  }
  DB.set('migratedExpress', true);
}
// one-time: rename exercises across routines + history (keeps progress continuous)
const RENAME_MAP = { 'Dumbbell Bench Press': 'Bench Press' };
function migrateRename(){
  if(DB.get('migratedRenameV1', false)) return;
  const rs = getRoutines();
  rs.forEach(r=>r.days.forEach(d=>d.exercises.forEach(e=>{
    if(RENAME_MAP[e.name]) e.name = RENAME_MAP[e.name];
    if(e.superset && RENAME_MAP[e.superset]) e.superset = RENAME_MAP[e.superset];
  })));
  saveRoutines(rs);
  const h = getHistory();
  h.forEach(s=>{
    Object.keys(RENAME_MAP).forEach(oldN=>{
      if(s.exercises[oldN]){
        const newN = RENAME_MAP[oldN];
        s.exercises[newN] = (s.exercises[newN]||[]).concat(s.exercises[oldN]);
        delete s.exercises[oldN];
      }
    });
  });
  saveHistory(h);
  DB.set('migratedRenameV1', true);
}
// one-time: tag the seed cardio/core exercises with their tracking types
const TRACK_MAP = {
  'Burpees': { track:'reps' },
  'Plank': { track:'time', workSec:60, rest:45 },
  'Punching Bag Rounds': { track:'interval', sets:1, rounds:3, workSec:180, restSec:60, rest:0 },
};
function migrateTrack(){
  if(DB.get('migratedTrackV1', false)) return;
  const rs = getRoutines();
  rs.forEach(r=>r.days.forEach(d=>d.exercises.forEach(e=>{
    const m = TRACK_MAP[e.name];
    if(m && !e.track){ Object.assign(e, m); }
  })));
  saveRoutines(rs);
  DB.set('migratedTrackV1', true);
}
function activeRoutine(){ const rs = getRoutines(); return rs.find(r=>r.id===getActiveId()) || rs[0] || deepCopy(SEED_ROUTINE); }
function routineById(id){ return getRoutines().find(r=>r.id===id); }
function days(){ return activeRoutine().days || []; }
function getDay(code){ return days().find(d=>d.code===code); }
function dayColorFor(code, fallback){ const d = getDay(code); return d ? d.color : (fallback||'#888'); }

function allExerciseNames(){
  const set = new Set();
  getRoutines().forEach(r=>r.days.forEach(d=>d.exercises.forEach(e=>set.add(e.name))));
  getHistory().forEach(s=>Object.keys(s.exercises).forEach(n=>set.add(n)));
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function exColor(name){
  for(const d of days()){ if(d.exercises.some(e=>e.name===name)) return d.color; }
  for(const r of getRoutines()){ for(const d of r.days){ if(d.exercises.some(e=>e.name===name)) return d.color; } }
  return '#888';
}

// ---- superset pairing ----
// Returns ordered blocks: { type:'single', a } or { type:'ss', a, b } (indices
// into exs). Pairs by exact partner-name match, falling back to "next exercise
// also flagged superset" — which resolves all the seed data correctly even where
// the superset label doesn't exactly match the partner's full name.
function buildBlocks(exs){
  const used = new Array(exs.length).fill(false);
  const blocks = [];
  for(let i=0;i<exs.length;i++){
    if(used[i]) continue;
    const ex = exs[i];
    if(ex.superset){
      let j = exs.findIndex((e,k)=>!used[k] && k!==i && e.name===ex.superset);
      if(j<0 && i+1<exs.length && !used[i+1] && exs[i+1].superset) j = i+1;
      if(j>=0){ used[i]=used[j]=true; blocks.push({ type:'ss', a:i, b:j }); continue; }
    }
    used[i]=true; blocks.push({ type:'single', a:i });
  }
  return blocks;
}
function findBlockFor(blocks, exs, exName){
  return blocks.find(bl => bl.type==='single'
    ? exs[bl.a].name===exName
    : (exs[bl.a].name===exName || exs[bl.b].name===exName));
}
function loggedCount(name){ return (state.logged[name]||[]).filter(Boolean).length; }
function extraFor(name){ return (state._extra && state._extra[name]) || 0; }

// ---- history (keyed by exercise NAME → progress spans routines) ----
function getHistory(){ return DB.get('workoutHistory', []); }
function saveHistory(h){ DB.set('workoutHistory', h); }
function saveSession(dayCode, logged){
  const clean = {};
  Object.keys(logged).forEach(k => { const arr = (logged[k]||[]).filter(Boolean); if(arr.length) clean[k] = arr; });
  if(!Object.keys(clean).length) return false;
  const r = activeRoutine();
  const d = getDay(dayCode);
  const snap = {}, dbn = {};
  Object.keys(clean).forEach(k => {
    if(state.snap && (k in state.snap)) snap[k] = state.snap[k];
    if(state.dbn && (k in state.dbn)) dbn[k] = state.dbn[k];
  });
  const h = getHistory();
  h.push({
    date: new Date().toISOString(),
    day: dayCode,
    focus: d ? d.focus : '',
    color: d ? d.color : '#888',
    express: d ? !!d.express : false,
    routine: r ? r.name : '',
    routineId: r ? r.id : '',
    snap: snap,            // per-exercise dumbbell mode used this session
    dbn: dbn,              // per-exercise dumbbell count (1 or 2)
    exercises: clean
  });
  saveHistory(h);
  return true;
}
// Look up what was used last time this exercise was done in the same day/routine.
function lastFieldFor(field, routineId, dayCode, exName){
  const h = getHistory();
  for(let i=h.length-1;i>=0;i--){
    const s = h[i];
    if(s.day===dayCode && (!routineId || s.routineId===routineId) && s[field] && (exName in s[field])) return s[field][exName];
  }
  return null;
}
function lastSnapFor(routineId, dayCode, exName){ return lastFieldFor('snap', routineId, dayCode, exName); }
function lastDbnFor(routineId, dayCode, exName){ return lastFieldFor('dbn', routineId, dayCode, exName); }
function lastSessionSets(exName){
  const h = getHistory();
  for(let i=h.length-1;i>=0;i--){
    const e = h[i].exercises[exName];
    if(e && e.length){ return { sets: e.filter(Boolean), date: h[i].date }; }
  }
  return null;
}
function lastWeightFor(exName){
  const ls = lastSessionSets(exName);
  if(!ls) return '';
  const last = ls.sets[ls.sets.length-1];
  return last ? last.w : '';
}
function prFor(exName){
  const track = trackForName(exName);
  const h = getHistory(); let max = 0;
  h.forEach(s=>{ const mult=sessMult(s,exName); (s.exercises[exName]||[]).forEach(set=>{ const m=setMetric(track,set,mult); if(m>max) max=m; }); });
  return max;
}
function exHistory(exName){
  const track = trackForName(exName);
  const h = getHistory(); const out = [];
  h.forEach(s=>{
    const sets = (s.exercises[exName]||[]).filter(Boolean);
    if(sets.length){ const mult=sessMult(s,exName); out.push({ date: s.date, top: Math.max(...sets.map(x=>setMetric(track,x,mult))) }); }
  });
  return out.slice(-10);
}
function updateHistorySet(date, exName, idx, w, reps){
  const h = getHistory(); const s = h.find(x=>x.date===date);
  if(!s || !s.exercises[exName] || !s.exercises[exName][idx]) return;
  s.exercises[exName][idx] = { w: w||0, reps: reps||0 };
  saveHistory(h);
}
function deleteHistorySet(date, exName, idx){
  const h = getHistory(); const s = h.find(x=>x.date===date);
  if(!s || !s.exercises[exName]) return;
  s.exercises[exName].splice(idx,1);
  if(!s.exercises[exName].length) delete s.exercises[exName];
  if(!Object.keys(s.exercises).length){ saveHistory(h.filter(x=>x.date!==date)); state.openSession=null; }
  else saveHistory(h);
  render();
}
function addHistorySet(date, exName){
  const h = getHistory(); const s = h.find(x=>x.date===date);
  if(!s) return;
  const arr = s.exercises[exName] = s.exercises[exName] || [];
  const last = arr[arr.length-1];
  const track = trackForName(exName);
  if(track==='reps') arr.push({ reps: last ? last.reps : 0 });
  else if(track==='time') arr.push({ sec: last ? last.sec : 0 });
  else if(track==='interval') arr.push({ rounds: last ? last.rounds : 0 });
  else arr.push({ w: last ? last.w : 0, reps: last ? last.reps : 0 });
  saveHistory(h); render();
}
function deleteSession(date){
  if(!confirm('Delete this entire workout? This cannot be undone.')) return;
  saveHistory(getHistory().filter(s=>s.date!==date));
  state.openSession = null; render(); toast('Workout deleted');
}

//  STATE
// ================================================================
let state = {
  tab: 'today', day: null, expanded: 0, logged: {}, timer: null, snap: {}, dbn: {},
  histTab: 'workouts', openSession: null,
  progView: 'info', editId: null, editDayOpen: null, exForm: null,
};
let timerInterval = null;

// ================================================================
//  TIMER
// ================================================================
function beep(kind){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    // a short triple chirp when work starts (rest ends), a single tone otherwise
    const tones = kind==='rest' ? [660] : kind==='work-start' ? [523,659,784] : [880];
    tones.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
      o.frequency.value=f; o.type='sine';
      const t0=ctx.currentTime+i*0.18;
      g.gain.setValueAtTime(0.3, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.55);
      o.start(t0); o.stop(t0+0.55);
    });
  } catch(e){}
  if(navigator.vibrate) navigator.vibrate(kind==='work-start'?[120,80,120,80,200]:[200,100,200]);
}
function phaseAccent(kind){ return kind==='rest' ? 'var(--cond)' : 'var(--accent)'; }
// Run a queue of phases [{kind:'work'|'rest', label, seconds}]; auto-advances (hands-free).
function startPhases(phases, onDone){
  phases = (phases||[]).filter(p=>p && p.seconds>0);
  if(!phases.length){ if(onDone) onDone(); return; }
  clearInterval(timerInterval);
  state.timer = { phases, idx:0, remaining: phases[0].seconds, total: phases[0].seconds, onDone: onDone||null };
  render();
  timerInterval = setInterval(timerTick, 1000);
}
function timerTick(){
  const t = state.timer; if(!t) return;
  t.remaining--;
  if(t.remaining<=0){
    if(t.idx < t.phases.length-1){
      t.idx++;
      const ph = t.phases[t.idx];
      beep(ph.kind==='work' ? 'work-start' : 'rest');
      t.remaining = ph.seconds; t.total = ph.seconds;
      render();
    } else {
      clearInterval(timerInterval);
      beep('rest');
      const cb = t.onDone; state.timer = null; render();
      if(cb){ try{ cb(); }catch(e){} }
      return;
    }
  }
  updateTimerView();
}
function startTimer(seconds, nextLabel){ startPhases([{ kind:'rest', label: nextLabel||'Rest', seconds }]); }
function stopTimer(){ clearInterval(timerInterval); state.timer=null; render(); }
function skipPhase(){
  const t = state.timer; if(!t) return;
  if(t.idx < t.phases.length-1){
    t.idx++; const ph=t.phases[t.idx]; t.remaining=ph.seconds; t.total=ph.seconds; render();
  } else { stopTimer(); }
}
function addTimer(s){ if(state.timer){ state.timer.remaining+=s; state.timer.total+=s; updateTimerView(); } }
function updateTimerView(){
  const t = state.timer; if(!t) return;
  const el = document.getElementById('timerT'); if(!el) return;
  el.textContent = fmtTime(Math.max(0,t.remaining));
  const ph = t.phases[t.idx];
  const ring = document.getElementById('timerRing');
  if(ring){ const pct = t.total ? (t.remaining/t.total) : 0; ring.style.background =
    `conic-gradient(${phaseAccent(ph.kind)} ${pct*360}deg, #222 0deg)`; }
}

function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

// ================================================================
function openDay(d){
  pushNav(); state.day=d; state.expanded=0; state.logged={}; state._extra={};
  // Seed each exercise's dumbbell mode + count from the last equivalent session, else defaults.
  state.snap = {}; state.dbn = {};
  const day = getDay(d); const rid = (activeRoutine()||{}).id;
  (day ? day.exercises : []).forEach(ex=>{
    const last = lastSnapFor(rid, d, ex.name);
    state.snap[ex.name] = (last!=null) ? last : !!(isDumbbell(ex) && getSetting('dbSnap', true));
    const lastN = lastDbnFor(rid, d, ex.name);
    state.dbn[ex.name] = (lastN===1||lastN===2) ? lastN : dbCount(ex);
  });
  render();
}
function setExSnap(name, on){ if(!state.snap) state.snap={}; state.snap[name]=on; render(); }
function exitDay(){
  const any = Object.values(state.logged).some(a=>a&&a.filter(Boolean).length);
  if(any){ if(saveSession(state.day, state.logged)) toast('Session saved'); }
  state.day=null; render(); popNavUI();
}
function toggleBlock(primary, members){ state.expanded = members.includes(state.expanded) ? -1 : primary; render(); }
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function blockIncomplete(exs, bl){
  if(bl.type==='single'){ const ex=exs[bl.a]; return loggedCount(ex.name) < effSets(ex); }
  const A=exs[bl.a], B=exs[bl.b];
  return loggedCount(A.name) < effSets(A) || loggedCount(B.name) < effSets(B);
}
function advanceAfter(exs, blocks, block){
  const pos = blocks.indexOf(block);
  for(let k=pos+1;k<blocks.length;k++){
    const bl = blocks[k];
    if(blockIncomplete(exs, bl)){
      state.expanded = bl.a;
      return bl.type==='ss'
        ? 'Next: '+exs[bl.a].name+' + '+exs[bl.b].name
        : 'Next: '+exs[bl.a].name;
    }
  }
  return '🎉 All exercises done';
}

function curEx(exName){ const d=getDay(state.day); return d ? d.exercises.find(e=>e.name===exName) : null; }
function logSet(exName, setIdx, rest){
  const key = exName.replace(/\W/g,'');
  if(state.logged[exName] && state.logged[exName][setIdx]){
    state.logged[exName][setIdx] = null; render(); return;   // un-log to edit
  }
  const exDef = curEx(exName); const track = trackOf(exDef||{});
  const w = val('w_'+key+'_'+setIdx);
  const r = val('r_'+key+'_'+setIdx);
  let setObj;
  if(track==='reps'){
    if(!r){ toast('Enter reps'); return; }
    setObj = { reps: r||0 };
  } else {
    if(!w && !r){ toast('Enter weight or reps'); return; }
    setObj = { w: w||0, reps: r||0 };
  }
  if(!state.logged[exName]) state.logged[exName]=[];
  const prevPR = prFor(exName);
  state.logged[exName][setIdx] = setObj;
  const metricNow = setMetric(track, setObj, effDbCount(exDef||{}));
  const isPR = metricNow > prevPR && prevPR>0;
  const prMsg = '🏆 New PR: ' + fmtMetric(track, metricNow) + '!';

  const dayDef = getDay(state.day);
  const exs = dayDef.exercises;
  const blocks = buildBlocks(exs);
  const block = findBlockFor(blocks, exs, exName);

  // ---- SUPERSET: don't rest until the partner's matching set is logged ----
  if(block && block.type==='ss'){
    const A = exs[block.a], B = exs[block.b];
    const partner = exName===A.name ? B : A;
    const pLogged = (state.logged[partner.name]||[]);
    const partnerExpected = setIdx < (partner.sets + extraFor(partner.name)) || setIdx < pLogged.length;
    const partnerDone = !!pLogged[setIdx];
    if(partnerExpected && !partnerDone){
      render();
      if(isPR) setTimeout(()=>toast(prMsg),200);
      else toast('Now log ' + partner.name);
      return; // no timer yet
    }
    const ssRest = Math.max(A.rest, B.rest);
    let nextLabel;
    if(loggedCount(A.name) >= effSets(A) && loggedCount(B.name) >= effSets(B)){
      nextLabel = advanceAfter(exs, blocks, block);
    } else {
      nextLabel = 'Round ' + (setIdx+2) + ': ' + A.name + ' + ' + B.name;
    }
    startTimer(ssRest, nextLabel);
    if(isPR) setTimeout(()=>toast(prMsg),300);
    return;
  }

  // ---- SINGLE ----
  const ex = exs[block.a];
  let nextLabel = '';
  if(loggedCount(ex.name) >= effSets(ex)) nextLabel = advanceAfter(exs, blocks, block);
  startTimer(rest, nextLabel);
  if(isPR) setTimeout(()=>toast(prMsg),300);
}

function editCurrentSet(exName, setIdx){
  if(!(state.logged[exName] && state.logged[exName][setIdx])) return;
  const key = exName.replace(/\W/g,'');
  const track = trackOf(curEx(exName)||{});
  if(track==='reps') state.logged[exName][setIdx] = { reps: val('r_'+key+'_'+setIdx)||0 };
  else state.logged[exName][setIdx] = { w: val('w_'+key+'_'+setIdx)||0, reps: val('r_'+key+'_'+setIdx)||0 };
}
// ---- timed (plank) and interval (boxing) logging ----
function startWork(exName, setIdx){
  const ex = curEx(exName); if(!ex) return;
  const workSec = Math.max(1, +ex.workSec||45);
  if(!state.logged[exName]) state.logged[exName]=[];
  state.logged[exName][setIdx] = { sec: workSec };
  const exs=getDay(state.day).exercises, blocks=buildBlocks(exs), block=findBlockFor(blocks,exs,exName);
  let nextLabel = '';
  if(loggedCount(exName) >= effSets(ex)) nextLabel = advanceAfter(exs, blocks, block);
  const phases = [{ kind:'work', label:exName, seconds:workSec }];
  if(+ex.rest>0) phases.push({ kind:'rest', label: nextLabel||'Rest', seconds:+ex.rest });
  startPhases(phases);
}
function startInterval(exName){
  const ex = curEx(exName); if(!ex) return;
  const rounds = Math.max(1, +ex.rounds||3), workSec = Math.max(1,+ex.workSec||180), restSec = Math.max(0,+ex.restSec||60);
  if(!state.logged[exName]) state.logged[exName]=[];
  state.logged[exName][0] = { rounds, workSec, restSec };
  const phases = [];
  for(let i=0;i<rounds;i++){
    phases.push({ kind:'work', label:'Round '+(i+1)+' of '+rounds, seconds:workSec });
    if(i<rounds-1 && restSec>0) phases.push({ kind:'rest', label:'Rest · next Round '+(i+2), seconds:restSec });
  }
  const exs=getDay(state.day).exercises, blocks=buildBlocks(exs), block=findBlockFor(blocks,exs,exName);
  const nextLabel = advanceAfter(exs, blocks, block);
  startPhases(phases, ()=>{ toast(nextLabel); });
}
function unlogSet(exName, setIdx){
  if(state.logged[exName]) state.logged[exName][setIdx] = null;
  render();
}
function addExtraSet(exName){
  if(!state.logged[exName]) state.logged[exName]=[];
  state._extra = state._extra||{}; state._extra[exName]=(state._extra[exName]||0)+1;
  render();
}
function addRound(aName, bName){
  state._extra = state._extra||{};
  state._extra[aName] = (state._extra[aName]||0)+1;
  state._extra[bName] = (state._extra[bName]||0)+1;
  if(!state.logged[aName]) state.logged[aName]=[];
  if(!state.logged[bName]) state.logged[bName]=[];
  render();
}

let _navDepth = 0;
let _ignoreNextPop = false;

function pushNav(){
  _navDepth++;
  history.pushState({ navDepth: _navDepth }, '');
}
function popNavUI(){
  // UI back button: consume the history entry we pushed, suppress the resulting popstate
  if(_navDepth > 0){ _navDepth--; _ignoreNextPop = true; history.back(); }
}
window.addEventListener('popstate', () => {
  if(_ignoreNextPop){ _ignoreNextPop = false; return; }
  if(_navDepth > 0) _navDepth--;
  // Navigate back within the app
  if(state.day !== null){
    const any = Object.values(state.logged).some(a => a && a.filter(Boolean).length);
    if(any){ if(saveSession(state.day, state.logged)) toast('Session saved'); }
    state.day = null; render();
  } else if(state.openSession !== null){
    state.openSession = null; render();
  } else if(state.progView === 'edit'){
    state.progView = 'routines'; state.editId = null; state.exForm = null; render();
  } else if(state.progView === 'routines'){
    state.progView = 'info'; render();
  }
});

// Mutate a routine in place and persist the SAME array. (getRoutines() re-parses

function mutateRoutine(id, fn){

  saveRoutines(rs);

}

function nextDayCode(r){
  const used = new Set(r.days.map(d=>d.code));
  for(let i=0;i<26;i++){ const c=String.fromCharCode(65+i); if(!used.has(c)) return c; }
  return 'D'+(r.days.length+1);
}
function nextExpressCode(r){
  const used = new Set(r.days.map(d=>d.code));
  for(let i=1;i<99;i++){ const c='X'+i; if(!used.has(c)) return c; }
  return 'X'+(r.days.length+1);
}

// snapshot the form inputs (so values survive a re-render when the type changes)
function readExForm(){

    name: val('ef_name'), track: val('ef_track')||'weight',

    workSec: val('ef_work'), restSec: val('ef_restsec'), rounds: val('ef_rounds'),
    equipment: val('ef_equip'), muscle: val('ef_muscle'), superset: val('ef_ss'),
    cues: val('ef_cues'), why: val('ef_why')
  };
}
function exFormChangeTrack(){ if(state.exForm){ state.exForm.draft = readExForm(); render(); } }
function saveExForm(id, code){
  const f = readExForm();
  if(!f.name){ toast('Exercise needs a name'); return; }
  const track = f.track || 'weight';
  const ex = { name: f.name };
  if(track!=='weight') ex.track = track;
  if(track==='interval'){
    ex.sets = 1;
    ex.rounds = Math.max(1, parseInt(f.rounds)||3);
    ex.workSec = Math.max(1, parseInt(f.workSec)||180);
    ex.restSec = Math.max(0, parseInt(f.restSec)||60);
    ex.rest = 0;
  } else if(track==='time'){
    ex.sets = Math.max(1, parseInt(f.sets)||3);
    ex.workSec = Math.max(1, parseInt(f.workSec)||45);
    ex.rest = Math.max(0, parseInt(f.rest)||60);
  } else {
    ex.sets = Math.max(1, parseInt(f.sets)||3);
    ex.reps = f.reps || '10';
    ex.rest = Math.max(0, parseInt(f.rest)||60);
  }
  if(track==='weight'||track==='reps'){
    if(f.equipment) ex.equipment = f.equipment;
    if(f.superset) ex.superset = f.superset;
  }
  if(f.muscle) ex.muscle = f.muscle;
  if(f.cues) ex.cues = f.cues;
  if(f.why) ex.why = f.why;
  const idx = state.exForm.idx;
  const ok = mutateRoutine(id, r=>{
    const d = r.days.find(x=>x.code===code); if(!d) return;
    if(idx===null || idx===undefined) d.exercises.push(ex);
    else d.exercises[idx] = ex;
  });
  if(!ok){ toast('Could not save'); return; }
  state.exForm=null; render();
}

function exportData(){
  const payload = {
    version: 2, exportedAt: new Date().toISOString(),
    activeRoutine: getActiveId(), routines: getRoutines(), history: getHistory()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'workout-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importData(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const incoming = JSON.parse(e.target.result);
      let histIn, routinesIn=null, activeIn=null;
      if(Array.isArray(incoming)){ histIn = incoming; }
      else { histIn = incoming.history||[]; routinesIn = incoming.routines||null; activeIn = incoming.activeRoutine||null; }

      const existing = getHistory();
      const seen = new Set(existing.map(s => s.date));
      const merged = existing.slice(); let added = 0;
      histIn.forEach(s => { if(s && s.date && !seen.has(s.date)){ merged.push(s); seen.add(s.date); added++; } });
      merged.sort((a,b)=> new Date(a.date) - new Date(b.date));
      saveHistory(merged);

      let rAdded = 0;
      if(routinesIn && routinesIn.length){
        const rs = getRoutines(); const rseen = new Set(rs.map(r=>r.id));
        routinesIn.forEach(r=>{ if(r && r.id && !rseen.has(r.id)){ rs.push(r); rseen.add(r.id); rAdded++; } });
        saveRoutines(rs);
        if(activeIn && rs.some(r=>r.id===activeIn)) setActiveId(activeIn);
      }
      render();
      const parts = [];
      if(added) parts.push(added+' session'+(added>1?'s':''));
      if(rAdded) parts.push(rAdded+' routine'+(rAdded>1?'s':''));
      toast(parts.length ? ('Imported '+parts.join(' + ')) : 'Already up to date');
    } catch(err){ toast('Import failed — invalid file'); }
  };
  reader.readAsText(file); input.value = '';
}
function clearAllHistory(){
  if(!getHistory().length){ toast('No history to clear'); return; }
  if(!confirm('Delete ALL workout history? This cannot be undone. (Your routines are kept.)')) return;
  saveHistory([]);
  state.openSession = null;
  render(); toast('History cleared');
}

function exportRoutines(){

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });

  const a = document.createElement('a');
  a.href = url; a.download = 'workout-routines-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Routines exported');
}
function importRoutines(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const incoming = Array.isArray(data) ? data : (data.routines || []);
      if(!incoming.length) throw new Error('no routines');
      const rs = getRoutines();
      const ids = new Set(rs.map(r=>r.id));
      const names = new Set(rs.map(r=>r.name));
      let added = 0;
      incoming.forEach(r=>{
        if(!r || !r.name || !Array.isArray(r.days)) return;       // skip malformed
        const copy = deepCopy(r);
        if(!copy.id || ids.has(copy.id)) copy.id = uid();          // never collide
        if(names.has(copy.name)) copy.name = copy.name + ' (imported)';
        ids.add(copy.id); names.add(copy.name);
        rs.push(copy); added++;
      });
      if(!added) throw new Error('nothing valid');
      saveRoutines(rs); render();
      toast('Imported '+added+' routine'+(added>1?'s':''));
    } catch(err){ toast('Import failed — invalid routine file'); }
  };
  reader.readAsText(file); input.value = '';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sq(s){ return esc(s).replace(/'/g,"\\'"); }
function restTxt(rest){ return rest>=60 ? (rest%60===0? rest/60+' min' : rest+' sec') : rest+' sec'; }

// ---- weight pickers (stack-aware for dumbbells) ----
// The user's adjustable dumbbells snap to these per-dumbbell weights only.
const DB_STACK = [2.5,3.5,4.5,5.5,6.5,8,9,10,11.5,13.5,16,18,20.5,22.5,24];
// Generic plate/cable/machine fallback: 0–120 kg in 2.5 kg steps.
const GEN_STACK = (function(){ const a=[]; for(let w=0; w<=120; w+=2.5) a.push(w); return a; })();
const REP_OPTS = (function(){ const a=[]; for(let r=0; r<=60; r++) a.push(r); return a; })();

function exText(ex){ return ((ex&&ex.equipment||'')+' '+(ex&&ex.name||'')).toLowerCase(); }
function isDumbbell(ex){ return /dumbbell|goblet/.test(exText(ex)); }
function isBodyweight(ex){ return /bodyweight|pull-?up|chin-?up|\bdip\b|dips|burpee|plank|push-?up|punching|bag/.test(exText(ex)); }

// ---- muscle-group classification (for dynamic volume balance) ----
// First matching rule wins, so order from most-specific to general.
const MUSCLE_RULES = [
  [/face ?pull|rear ?delt|reverse ?fly|rear ?fly/, 'Rear Delts'],
  [/lateral raise|side raise|lat raise/, 'Side Delts'],
  [/shoulder press|overhead press|\bohp\b|military|arnold|thruster/, 'Shoulders'],
  [/tricep|pushdown|push-?down|skull|close ?grip|\bdip\b|dips/, 'Triceps'],
  [/curl/, 'Biceps'],
  [/bench|chest|pec|push-?up|fly|incline|decline/, 'Chest'],
  [/lat ?pulldown|pull-?up|chin-?up|\brow\b|pulldown|\blat\b|back extension/, 'Back'],
  [/squat|leg press|lunge|leg extension|step-?up/, 'Quads'],
  [/deadlift|\brdl\b|romanian|hip thrust|hamstring|leg curl|good ?morning|hinge/, 'Hamstrings'],
  [/calf|calves/, 'Calves'],
  [/plank|crunch|\babs?\b|core|sit-?up|hollow|leg raise|rollout/, 'Core'],
  [/burpee|sprint|\brun\b|jog|erg|cardio|bag|conditioning|jump ?rope|skip/, 'Conditioning'],
];
const MUSCLE_COLOR = {
  'Chest':'#FF6B2C', 'Back':'#2B8AF0', 'Shoulders':'#F4A012', 'Side Delts':'#9C7BFF',
  'Rear Delts':'#7048E8', 'Triceps':'#E8590C', 'Biceps':'#1971C2', 'Quads':'#2FD27A',
  'Hamstrings':'#12B886', 'Calves':'#15AABF', 'Core':'#E64980', 'Conditioning':'#FF8787',
  'Other':'#5a6473'
};
const MUSCLE_GROUPS = Object.keys(MUSCLE_COLOR);
function muscleOf(name){
  const n = String(name||'').toLowerCase();
  for(const [re,m] of MUSCLE_RULES){ if(re.test(n)) return m; }
  return 'Other';
}
// Prefer the muscle configured on the exercise; else infer from the name.
function muscleForName(name){
  for(const r of getRoutines()){
    for(const d of r.days){
      const e = d.exercises.find(x=>x.name===name);
      if(e && e.muscle) return e.muscle;
    }
  }
  return muscleOf(name);
}
function muscleColor(m){ return MUSCLE_COLOR[m] || '#5a6473'; }
// Planned = active routine's main (non-express) days; Actual = sets logged in last 7 days.
function computeVolume(){
  const r = activeRoutine();
  const mains = (r.days||[]).filter(d=>!d.express);
  const useDays = mains.length ? mains : (r.days||[]);
  const planned = {};
  useDays.forEach(d=>d.exercises.forEach(e=>{ const m=e.muscle||muscleOf(e.name); planned[m]=(planned[m]||0)+(+e.sets||0); }));
  const cutoff = Date.now() - 7*24*3600*1000;
  const actual = {};
  getHistory().forEach(s=>{
    if(new Date(s.date).getTime() < cutoff) return;
    Object.entries(s.exercises).forEach(([nm,arr])=>{
      const c = arr.filter(Boolean).length; if(!c) return;
      const m = muscleForName(nm); actual[m] = (actual[m]||0) + c;
    });
  });
  return { planned, actual };
}
// How many dumbbells the movement uses (matters for total-load / volume).
function dbCount(ex){
  const t = exText(ex);
  if(!/dumbbell|goblet/.test(t)) return 1;
  if(/goblet|single|one[- ]?arm|1[- ]?arm/.test(t)) return 1;
  if(/dumbbells/.test(t)) return 2;
  return 2; // a named "dumbbell" lift defaults to a matched pair
}
function dbCountByName(name){ return dbCount({ name }); }
function exDefByName(name){
  for(const r of getRoutines()){ for(const d of r.days){ const e=d.exercises.find(x=>x.name===name); if(e) return e; } }
  return null;
}
function dbCountForName(name){ const e=exDefByName(name); return e ? dbCount(e) : dbCountByName(name); }
// Per-exercise "dumbbell mode" for the current session (state.snap[name]).
// Falls back to the global default when not in a session.
function snapOn(name){
  if(state.snap && (name in state.snap)) return state.snap[name];
  return !!getSetting('dbSnap', true);
}
// Current-session dumbbell count (1 or 2) — user-chosen via the 1×/2× toggle.
function dbnNow(ex){ const n = state.dbn && state.dbn[ex.name]; return (n===1||n===2) ? n : dbCount(ex); }
function effDbCount(ex){ return snapOn(ex.name) ? dbnNow(ex) : 1; }       // ×2 only in dumbbell mode
function weightOptions(ex){ return snapOn(ex.name) ? DB_STACK : GEN_STACK; }
function fmtW(w){ return Number.isInteger(w) ? String(w) : String(w); }
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }

// ---- tracking type: 'weight' (default) | 'reps' | 'time' | 'interval' ----
function trackOf(ex){ return (ex && ex.track) || 'weight'; }
function trackForName(name){ const e=exDefByName(name); return e ? trackOf(e) : 'weight'; }
// Effective weight multiplier a session used for an exercise (the ×2 dumbbell doubling).
function sessMult(s, name){
  if(s && s.snap && s.snap[name]===false) return 1;          // logged on a machine/other
  if(s && s.dbn && (name in s.dbn)) return s.dbn[name];      // explicit 1× / 2×
  if(s && s.snap && s.snap[name]===true) return dbCountForName(name);
  return dbCountForName(name);                                // legacy sessions
}
// The tracked metric of one logged set, given its track type and weight multiplier.
function setMetric(track, set, mult){
  if(!set) return 0;
  if(track==='reps') return +set.reps||0;
  if(track==='time') return +set.sec||0;
  if(track==='interval') return +set.rounds||0;
  return (+set.w||0) * (mult||1);
}
function metricUnit(track){ return track==='reps'?'reps' : track==='time'?'' : track==='interval'?'rounds' : 'kg'; }
function fmtMetric(track, v){ return track==='time' ? fmtTime(v) : (String(v) + (metricUnit(track)?' '+metricUnit(track):'')); }
function effSets(ex){ return trackOf(ex)==='interval' ? 1 : (+ex.sets||0); }
// Step a <select> picker by one option (used by the −/+ buttons).
function stepSel(id, dir, exName, s){
  const el = document.getElementById(id); if(!el || el.disabled) return;
  let i = Math.max(0, Math.min(el.options.length-1, el.selectedIndex + dir));
  if(el.options[i] && el.options[i].value==='__custom__') i = Math.max(0, i-1); // skip the Other… sentinel
  el.selectedIndex = i;
  el.dataset.prevVal = el.value;
  if(navigator.vibrate) navigator.vibrate(8);
  editCurrentSet(exName, s);
}
// Build picker <option>s: the stack values, plus the current value if it falls
// off-stack (a typed override), plus an "Other…" sentinel for free entry.
function pickerOptsHTML(baseOpts, value){
  const v = parseFloat(value);
  let arr = baseOpts.slice();
  if(!isNaN(v) && arr.indexOf(v) < 0){ arr = arr.concat(v).sort((a,b)=>a-b); }
  return arr.map(o=>`<option value="${o}" ${o===v?'selected':''}>${fmtW(o)}</option>`).join('')
    + `<option value="__custom__">Other…</option>`;
}
// Picking "Other…" prompts for any number, overriding the snap stack.
function onPick(sel, exName, s, kind){
  if(sel.value === '__custom__'){
    const v = prompt('Enter '+(kind==='reps'?'reps':'weight (kg)')+':', sel.dataset.prevVal||'');
    const num = v===null ? NaN : parseFloat(v);
    if(!isNaN(num) && num>=0){
      let opt = sel.querySelector('option[data-custom]');
      if(!opt){ opt = document.createElement('option'); opt.setAttribute('data-custom',''); sel.insertBefore(opt, sel.options[sel.options.length-1]); }
      opt.value = String(num); opt.textContent = fmtW(num); sel.value = String(num);
    } else {
      sel.value = sel.dataset.prevVal || (sel.options[0] && sel.options[0].value) || '';
    }
  }
  sel.dataset.prevVal = sel.value;
  editCurrentSet(exName, s);
}
function fmtDate(iso, opts){ return new Date(iso).toLocaleDateString(undefined, opts||{month:'short',day:'numeric'}); }
function histDayColor(s){ return s.color || dayColorFor(s.day) || '#888'; }
function histFocus(s){ return s.focus || (getDay(s.day) ? getDay(s.day).focus : ''); }
function sessLabel(s){

        <button class="stepper" onclick="stepSel('r_${key}_${s}',1,'${sq(ex.name)}',${s})" tabindex="-1">+</button>
      </div>
      <button class="set-log-btn ${done?'logged':''}" onclick="logSet('${sq(ex.name)}',${s},${ex.rest})">${done?'✓':'Log'}</button>
    </div>`;
  }

  // ---- weight + reps (default) ----
  const lastW = lastWeightFor(ex.name);
  const wOpts = weightOptions(ex);
  let wDef;
  if(done) wDef = done.w;
  else if(logged[s-1]) wDef = logged[s-1].w;
  else if(lastW!=='') wDef = lastW;
  else wDef = isDumbbell(ex) ? 10 : (isBodyweight(ex) ? 0 : 20);
  const wVal = isNaN(parseFloat(wDef)) ? '' : String(parseFloat(wDef));
  const wSel = `<select class="picker" id="w_${key}_${s}" data-prev-val="${wVal}" ${done?'disabled':''} onchange="onPick(this,'${sq(ex.name)}',${s},'weight')">`+
    pickerOptsHTML(wOpts, wVal)+`</select>`;

  return `<div class="set-row ${done?'logged-row':''} ${opts.awaiting?'awaiting':''}">
    <div class="set-idx">${s+1}</div>
    <div class="field w">
      <button class="stepper" onclick="stepSel('w_${key}_${s}',-1,'${sq(ex.name)}',${s})" tabindex="-1">−</button>
      <div class="pwrap">${wSel}<span class="caret">▾</span></div>
      <button class="stepper" onclick="stepSel('w_${key}_${s}',1,'${sq(ex.name)}',${s})" tabindex="-1">+</button>
    </div>
    <div class="field r">
      <div class="pwrap">${rSel}<span class="caret">▾</span></div>
    </div>
    <button class="set-log-btn ${done?'logged':''}" onclick="logSet('${sq(ex.name)}',${s},${ex.rest})">${done?'✓':'Log'}</button>
  </div>`;
}
// small caption shown once per exercise when it uses two dumbbells (in DB mode)
function dbNote(ex){
  return effDbCount(ex)===2
    ? `<div class="db-note">🏋️ Two dumbbells — pick <b>one dumbbell's</b> weight. Total load is ×2.</div>`
    : '';
}
function wHeadLabel(ex){
  if(!snapOn(ex.name)) return 'Weight (kg)';
  return effDbCount(ex)===2 ? 'Weight · kg/ea' : 'Weight (kg)';
}
function setExDbn(name, n){ if(!state.dbn) state.dbn={}; state.dbn[name]=n; render(); }
// Per-exercise dumbbell/other weight-mode switch (+ 1×/2× count) shown in the session.
function snapToggleHTML(ex, showName){
  if(trackOf(ex)!=='weight') return '';                // only weighted lifts
  if(isBodyweight(ex) && !isDumbbell(ex)) return '';   // pointless for pure bodyweight
  const on = snapOn(ex.name);
  const n = dbnNow(ex);
  const countSeg = on ? `<div class="snap-seg" style="margin-left:8px">
      <button class="${n===1?'on':''}" onclick="setExDbn('${sq(ex.name)}',1)">1×</button>
      <button class="${n===2?'on':''}" onclick="setExDbn('${sq(ex.name)}',2)">2×</button>
    </div>` : '';
  return `<div class="snap-row">
    <span class="snap-label">${showName?esc(ex.name):'Weights'}</span>
    <div style="display:flex;align-items:center">
      <div class="snap-seg">
        <button class="${on?'on':''}" onclick="setExSnap('${sq(ex.name)}',true)">Dumbbell</button>
        <button class="${!on?'on':''}" onclick="setExSnap('${sq(ex.name)}',false)">Other</button>
      </div>
      ${countSeg}
    </div>
  </div>`;
}

function targetLabel(ex){
  const track = trackOf(ex);
  if(track==='time') return `${ex.sets} × ${fmtTime(+ex.workSec||45)}`;
  return `${ex.sets} × ${esc(ex.reps)}`;
}
function headRowHTML(ex){
  const track = trackOf(ex);
  if(track==='time') return '';
  if(track==='reps') return `<div class="sets-headrow"><div class="h-idx"></div><div class="h-col r" style="flex:1">Reps</div><div class="h-act"></div></div>`;
  return `<div class="sets-headrow"><div class="h-idx"></div><div class="h-col w">${wHeadLabel(ex)}</div><div class="h-col r">Reps</div><div class="h-act"></div></div>`;
}
function renderSingleBlock(ex, idx, num, accent){
  const open = state.expanded===idx;
  const track = trackOf(ex);
  const logged = state.logged[ex.name]||[];
  const doneCount = logged.filter(Boolean).length;
  const allDone = doneCount>=ex.sets;
  let h = `<div class="ex-card ${allDone?'done':''} ${open?'open':''}" style="--accent:${accent}">
    <div class="ex-top" onclick="toggleBlock(${idx},[${idx}])">
      <div class="ex-num ${allDone?'complete':(open?'active':'')}" style="${open&&!allDone?'background:'+accent:''}">${allDone?'✓':num}</div>
      <div style="flex:1">
        <div class="ex-name">${esc(ex.name)}</div>
        ${ex.equipment?`<div class="ex-equip">${esc(ex.equipment)}</div>`:''}
      </div>
      <div><div class="ex-target" style="color:${accent}">${targetLabel(ex)}</div>
      <div class="ex-rest">⏱ ${restTxt(ex.rest)}${doneCount?' · '+doneCount+'/'+ex.sets:''}</div></div>
      <span class="chev" style="transform:rotate(${open?'90':'0'}deg)">›</span>
    </div>`;
  if(open){
    h += `<div class="ex-body">` + lastPRLine(ex) + snapToggleHTML(ex, false) + dbNote(ex) +
      `<div class="sets-wrap">` + headRowHTML(ex);
    const total = Math.max(ex.sets + extraFor(ex.name), logged.length);
    for(let s=0;s<total;s++) h += setRowHTML(ex, s, {});
    h += `</div>`;
    if(track!=='time') h += `<button class="add-set" onclick="addExtraSet('${sq(ex.name)}')">+ Add set</button>`;
    if(allDone) h += `<div class="finish-banner">✓ Exercise complete${track!=='time'?' — tap a ✓ to fix a set':''}</div>`;
    h += cuesHTML(ex) + `</div>`;
  }
  h += `</div>`;
  return h;
}
// Interval / boxing: hands-free auto-cycling rounds of work + rest.
function renderIntervalBlock(ex, idx, num, accent){
  const open = state.expanded===idx;
  const done = !!(state.logged[ex.name] && state.logged[ex.name][0]);
  const rounds = +ex.rounds||3, workSec = +ex.workSec||180, restSec = +ex.restSec||60;
  const total = rounds*workSec + (rounds-1)*restSec;
  let h = `<div class="ex-card ${done?'done':''} ${open?'open':''}" style="--accent:${accent}">
    <div class="ex-top" onclick="toggleBlock(${idx},[${idx}])">
      <div class="ex-num ${done?'complete':(open?'active':'')}" style="${open&&!done?'background:'+accent:''}">${done?'✓':num}</div>
      <div style="flex:1">
        <div class="ex-name">${esc(ex.name)}<span class="express-tag">INTERVAL</span></div>
        ${ex.equipment?`<div class="ex-equip">${esc(ex.equipment)}</div>`:''}
      </div>
      <div><div class="ex-target" style="color:${accent}">${rounds} × ${fmtTime(workSec)}</div>
      <div class="ex-rest">rest ${fmtTime(restSec)}</div></div>
      <span class="chev" style="transform:rotate(${open?'90':'0'}deg)">›</span>
    </div>`;
  if(open){
    h += `<div class="ex-body">`;
    h += `<div class="last-time"><span class="pill">${rounds} rounds · ${fmtTime(workSec)} work · ${fmtTime(restSec)} rest</span><span class="pill">≈ ${fmtTime(total)} total</span></div>`;
    h += `<div class="db-note">🥊 Hands-free — it auto-cycles work → rest → next round. Best with sound on.</div>`;
    h += `<button class="time-btn ${done?'done':''}" onclick="${done?`unlogSet('${sq(ex.name)}',0)`:`startInterval('${sq(ex.name)}')`}">${done?'✓ Completed — tap to reset':'▶ Start '+rounds+' rounds'}</button>`;
    h += cuesHTML(ex) + `</div>`;
  }
  h += `</div>`;
  return h;
}

function renderSupersetBlock(exs, ai, bi, num, accent){
  const A = exs[ai], B = exs[bi];
  const open = state.expanded===ai || state.expanded===bi;
  const aDone = loggedCount(A.name) >= A.sets;
  const bDone = loggedCount(B.name) >= B.sets;
  const allDone = aDone && bDone;
  const totalDone = loggedCount(A.name) + loggedCount(B.name);
  const totalSets = A.sets + B.sets;
  const ssRest = Math.max(A.rest, B.rest);
  let h = `<div class="ex-card ss-card ${allDone?'done':''} ${open?'open':''}" style="--accent:${accent}">
    <div class="ex-top" onclick="toggleBlock(${ai},[${ai},${bi}])">
      <div class="ex-num ${allDone?'complete':(open?'active':'')}" style="${open&&!allDone?'background:'+accent:''}">${allDone?'✓':num}</div>
      <div style="flex:1">
        <div class="ex-name">${esc(A.name)} <span class="ss-plus">+</span> ${esc(B.name)}<span class="ss-tag">SUPERSET</span></div>
        <div class="ex-equip">Alternate · rest only after both</div>
      </div>
      <div><div class="ex-target" style="color:${accent}">⏱ ${restTxt(ssRest)}</div>
      <div class="ex-rest">${totalDone}/${totalSets} sets</div></div>
      <span class="chev" style="transform:rotate(${open?'90':'0'}deg)">›</span>
    </div>`;
  if(open){
    h += `<div class="ex-body">`;
    h += `<div class="ss-info">${ssMini(A)}${ssMini(B)}</div>`;
    h += snapToggleHTML(A, true) + snapToggleHTML(B, true);
    const rounds = Math.max(A.sets+extraFor(A.name), B.sets+extraFor(B.name),
                            (state.logged[A.name]||[]).length, (state.logged[B.name]||[]).length);
    for(let rd=0; rd<rounds; rd++){
      h += `<div class="ss-round">Round ${rd+1}</div>`;
      [A,B].forEach(ex=>{
        const other = ex===A ? B : A;
        const lg = state.logged[ex.name]||[];
        const og = state.logged[other.name]||[];
        const totalForEx = Math.max(ex.sets + extraFor(ex.name), lg.length);
        if(rd >= totalForEx) return; // this exercise has no set this round
        const awaiting = !lg[rd] && !!og[rd];
        h += `<div class="ss-ex-label" style="color:${accent}">${esc(ex.name)} <span>${ex.sets}×${esc(ex.reps)}${effDbCount(ex)===2?' · kg/ea ×2':''}</span></div>`;
        h += setRowHTML(ex, rd, { awaiting });
      });
    }
    h += `<button class="add-set" onclick="addRound('${sq(A.name)}','${sq(B.name)}')">+ Add round</button>`;
    if(allDone) h += `<div class="finish-banner">✓ Superset complete — tap a ✓ to fix a set</div>`;
    h += cuesHTML2(A, B) + `</div>`;
  }
  h += `</div>`;
  return h;
}
function ssMini(ex){
  const ls = lastSessionSets(ex.name); const pr = prFor(ex.name);
  return `<div class="ss-mini"><div class="ss-mini-n">${esc(ex.name)}</div>
    <div class="ss-mini-v">Last ${ls? esc(ls.sets.map(x=>x.w+'×'+x.reps).join(', ')) : '—'}${pr?' · PR '+pr+'kg':''}</div></div>`;
}

function renderSession(){
  const dayDef = getDay(state.day);
  if(!dayDef){ state.day=null; return renderToday(); }
  const accent = dayDef.color;
  let totSets=0, totDone=0;
  dayDef.exercises.forEach(ex=>{ const es=effSets(ex); totSets+=es; totDone += Math.min(loggedCount(ex.name), es); });
  const pct = totSets? Math.round(totDone/totSets*100) : 0;
  const title = dayDef.express ? esc(dayDef.focus) : 'Day '+state.day+' · '+esc(dayDef.focus);
  let h = `<div style="--accent:${accent}">
    <div class="sess-head">
      <button class="back" onclick="exitDay()">‹ Done &amp; save</button>
      <h2 style="color:${accent}">${title}${dayDef.express?'<span class="express-tag">EXPRESS</span>':''}</h2>
      <div class="muscles">${esc(dayDef.muscles)}</div>
      <div class="sess-prog"><div style="width:${pct}%;background:${accent}"></div></div>
    </div>`;
  if(!dayDef.exercises.length){
    h += `<div class="empty-ex">No exercises in this day yet.<br>Add them in Programme → Manage routines.</div>`;
  }
  const blocks = buildBlocks(dayDef.exercises);
  blocks.forEach((bl, i)=>{
    if(bl.type==='single'){
      const ex = dayDef.exercises[bl.a];
      h += trackOf(ex)==='interval'
        ? renderIntervalBlock(ex, bl.a, i+1, accent)
        : renderSingleBlock(ex, bl.a, i+1, accent);
    } else h += renderSupersetBlock(dayDef.exercises, bl.a, bl.b, i+1, accent);
  });
  h += `</div>`;
  return h;
}
function toggleMeta(btn){
  const d = btn.nextElementSibling;
  const hidden = d.classList.toggle('hidden');
  btn.textContent = hidden ? 'Show cues & rationale' : 'Hide cues & rationale';
}

function renderTimer(){
  const t = state.timer;
  const ph = t.phases[t.idx];
  const col = phaseAccent(ph.kind);
  const multi = t.phases.length > 1;
  const kindLabel = ph.kind==='rest' ? 'REST' : 'GO';
  const stepInfo = multi ? `<div class="timer-step">${t.idx+1} / ${t.phases.length}</div>` : '';
  return `<div class="timer-overlay">
    <div class="timer-phase" style="color:${col}">${kindLabel}</div>
    <div class="timer-ring" id="timerRing" style="border-radius:50%;padding:14px;background:conic-gradient(${col} 360deg,#222 0)">
      <div style="background:var(--bg);border-radius:50%;width:100%;height:100%;position:relative">
        <div class="timer-num">
          <div class="t" id="timerT">${fmtTime(t.remaining)}</div>
          <div class="lbl">${esc(ph.label||(ph.kind==='rest'?'Rest':'Work'))}</div>
          ${stepInfo}
        </div>
      </div>
    </div>
    <div class="timer-controls">
      <button class="timer-btn" onclick="addTimer(30)">+30s</button>

// ----------------- HISTORY -----------------
function renderHistory(){
  const hist = getHistory();
  let h = `<div class="header"><h1>History</h1><div class="sub">${hist.length} session${hist.length===1?'':'s'} logged</div></div><div class="pad">`;
  h += `<div class="seg">
    <button class="${state.histTab==='workouts'?'active':''}" onclick="setHistTab('workouts')">Workouts</button>
    <button class="${state.histTab==='progress'?'active':''}" onclick="setHistTab('progress')">Progress</button>
  </div>`;
  if(!hist.length){
    h += `<div class="empty"><span class="big">📭</span>No sessions logged yet.<br>Start a workout from the Today tab and it'll show up here.</div></div>`;
    return h;
  }
  h += state.histTab==='workouts' ? renderWorkoutsList(hist) : renderProgress();
  h += `</div>`;
  return h;
}
function renderWorkoutsList(hist){
  let h = '';
  hist.slice().reverse().forEach(s=>{
    const exNames = Object.keys(s.exercises);
    const totalSets = Object.values(s.exercises).reduce((a,arr)=>a+arr.filter(Boolean).length,0);
    const totalVol = Object.entries(s.exercises).reduce((a,[nm,arr])=>{
      const mult = sessMult(s, nm);   // reflects dumbbell mode + 1×/2× count
      return a + mult*arr.filter(Boolean).reduce((b,x)=>b+(+x.w||0)*(+x.reps||0),0);
    },0);
    h += `<div class="wk-card" onclick="openSession('${s.date}')">
      <div class="wk-top">
        <div>
          <div class="wk-day" style="color:${histDayColor(s)}">${sessLabel(s)}</div>
          <div class="wk-date">${fmtDate(s.date,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div>
          ${s.routine?`<div class="wk-routine">${esc(s.routine)}</div>`:''}
        </div>
        <div class="wk-stats"><b>${totalSets}</b> sets<br>${totalVol?Math.round(totalVol).toLocaleString()+' kg vol':exNames.length+' ex'}</div>
      </div>
      <div class="wk-exlist">${exNames.slice(0,6).map(n=>`<span class="wk-chip">${esc(n)}</span>`).join('')}${exNames.length>6?`<span class="wk-chip">+${exNames.length-6}</span>`:''}</div>
    </div>`;
  });
  return h;
}
function renderSessionDetail(){
  const s = getHistory().find(x=>x.date===state.openSession);
  if(!s){ state.openSession=null; return renderHistory(); }
  const accent = histDayColor(s);
  let h = `<div style="--accent:${accent}">
    <div class="sess-head">
      <button class="back" onclick="closeSession()">‹ History</button>
      <h2 style="color:${accent}">${sessLabel(s)}</h2>
      <div class="muscles">${fmtDate(s.date,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} · ${new Date(s.date).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}${s.routine?' · '+esc(s.routine):''}</div>
    </div>
    <div class="pad">`;
  const dd = getDay(s.day);
  const order = dd ? dd.exercises.map(e=>e.name) : [];
  const names = Object.keys(s.exercises).sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  names.forEach(name=>{
    const sets = s.exercises[name];
    const skey = (state.openSession+name).replace(/\W/g,'');
    const track = trackForName(name);
    const mult = sessMult(s, name);
    const top = Math.max(...sets.filter(Boolean).map(x=>setMetric(track,x,mult)), 0);
    const topLabel = track==='weight'
      ? ('top '+top+'kg'+(mult>1?' (×'+mult+')':''))
      : track==='interval' ? (top+' rounds') : track==='time' ? ('best '+fmtTime(top)) : ('top '+top+' reps');
    h += `<div class="det-ex">
      <h3>${esc(name)}<span style="font-size:12px;color:var(--muted);font-weight:500">${topLabel}</span></h3>`;
    sets.forEach((st,idx)=>{
      if(!st) return;
      const dq = `'${state.openSession}','${sq(name)}',${idx},'${skey}','${track}'`;
      let fields;
      if(track==='reps'){
        fields = `<input class="dinput" id="hr_${skey}_${idx}" type="number" inputmode="numeric" value="${st.reps}" onchange="saveHistEdit(${dq})"><span class="dunit">reps</span>`;
      } else if(track==='time'){
        fields = `<input class="dinput" id="hs_${skey}_${idx}" type="number" inputmode="numeric" value="${st.sec}" onchange="saveHistEdit(${dq})"><span class="dunit">sec</span>`;
      } else if(track==='interval'){
        fields = `<input class="dinput" id="hn_${skey}_${idx}" type="number" inputmode="numeric" value="${st.rounds}" onchange="saveHistEdit(${dq})"><span class="dunit">rds</span>`;
      } else {
        fields = `<input class="dinput" id="hw_${skey}_${idx}" type="number" inputmode="decimal" value="${st.w}" onchange="saveHistEdit(${dq})"><span class="dunit">kg</span>
        <input class="dinput" id="hr_${skey}_${idx}" type="number" inputmode="numeric" value="${st.reps}" onchange="saveHistEdit(${dq})"><span class="dunit">×</span>`;
      }
      h += `<div class="det-set"><div class="di">${idx+1}</div>${fields}
        <button class="ddel" onclick="deleteHistorySet('${state.openSession}','${sq(name)}',${idx})">×</button></div>`;
    });
    if(track!=='interval') h += `<button class="det-add" onclick="addHistorySet('${state.openSession}','${sq(name)}')">+ Add set</button>`;
    h += `</div>`;
  });
  h += `<div class="det-actions"><button class="danger-btn" onclick="deleteSession('${state.openSession}')">Delete workout</button></div>`;
  h += `</div></div>`;
  return h;
}
function saveHistEdit(date, name, idx, skey, track){
  let obj;
  if(track==='reps') obj = { reps: val('hr_'+skey+'_'+idx)||0 };
  else if(track==='time') obj = { sec: val('hs_'+skey+'_'+idx)||0 };
  else if(track==='interval') obj = { rounds: val('hn_'+skey+'_'+idx)||0 };
  else obj = { w: val('hw_'+skey+'_'+idx)||0, reps: val('hr_'+skey+'_'+idx)||0 };
  const h=getHistory(); const s=h.find(x=>x.date===date);
  if(s && s.exercises[name] && s.exercises[name][idx]){ s.exercises[name][idx]=obj; saveHistory(h); }
  toast('Set updated');
}

function renderProgress(){
  const allEx = allExerciseNames();
  let h = '', shown = 0;
  allEx.forEach(name=>{
    const hist = exHistory(name);
    if(!hist.length) return;
    shown++;
    const track = trackForName(name);
    const pr = prFor(name);
    const accent = exColor(name);
    const max = Math.max(...hist.map(x=>x.top),1);
    const last = hist[hist.length-1].top;
    const prev = hist.length>1 ? hist[hist.length-2].top : null;
    const fmtV = v => track==='time' ? fmtTime(v) : String(Math.round(v*10)/10);
    let trend='', tcls='flat';
    if(prev!==null){
      if(last>prev){ trend='▲ +'+fmtV(last-prev); tcls='up'; }
      else if(last<prev){ trend='▼ '+fmtV(last-prev); tcls='down'; }
      else { trend='● even'; tcls='flat'; }
    }
    const prUnit = track==='weight'?'PR kg':track==='reps'?'PR reps':track==='time'?'best':'PR rounds';
    h += `<div class="prog-ex" style="--accent:${accent}">
      <div class="prog-head">
        <div><h3>${esc(name)}</h3>
          <div class="prog-sub">${hist.length} session${hist.length===1?'':'s'} · last ${fmtDate(hist[hist.length-1].date)} ${trend?`· <span class="trend ${tcls}">${trend}</span>`:''}</div>
        </div>
        <div class="prog-pr"><div class="v">${fmtV(pr)}</div><div class="l">${prUnit}</div></div>
      </div>
      <div class="spark">`;
    hist.forEach(pt=>{
      const pctH = (pt.top/max)*100;
      const best = pt.top===pr && pr>0;
      h += `<div class="spark-col">
        <div class="spark-bar ${best?'best':''}" style="height:${Math.max(pctH,8)}%;background:${best?'var(--pr)':accent}"><span class="v">${fmtV(pt.top)}</span></div>
        <div class="spark-date">${fmtDate(pt.date)}</div>
      </div>`;
    });
    h += `</div></div>`;
  });
  if(!shown) h += `<div class="empty"><span class="big">📈</span>No weighted exercises logged yet.</div>`;
  return h;
}
